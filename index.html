<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e4f"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<script src="config.js"></script></head><body style="margin:0"><title>امتحانات مسار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: one centred exam column (max 760px); one question per screen; navigator grid below on phones, beside on desktop */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --ink:#15302f; --muted:#5b6f6d; --line:#d6e0de;
  --brand:#1f4e4f; --brand-soft:#e3eeec; --accent:#b97a12; --accent-soft:#f8ecd6;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --bad:#a3302a; --bad-soft:#f7e3e1; --flag:#b97a12;
  --display:"Reem Kufi","Noto Naskh Arabic",Tahoma,sans-serif;
  --body:"Noto Naskh Arabic","Amiri",Tahoma,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a1a; --surface:#162525; --ink:#e4efed; --muted:#9db2af; --line:#2b3f3e;
  --brand:#7cc4bf; --brand-soft:#1d3433; --accent:#e3a94a; --accent-soft:#3a2e17;
  --ok:#6fd19d; --ok-soft:#173326; --bad:#f08f86; --bad-soft:#3a1f1d; --flag:#e3a94a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a1a; --surface:#162525; --ink:#e4efed; --muted:#9db2af; --line:#2b3f3e;
  --brand:#7cc4bf; --brand-soft:#1d3433; --accent:#e3a94a; --accent-soft:#3a2e17;
  --ok:#6fd19d; --ok-soft:#173326; --bad:#f08f86; --bad-soft:#3a1f1d; --flag:#e3a94a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;direction:rtl}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;line-height:1.35;margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mast{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.mast .seal{width:44px;height:44px;border-radius:12px;background:var(--brand);color:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:22px}
.mast small{display:block;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
/* start */
.examcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:16px 0 20px}
.examcard{position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:right;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:6px}
.examcard[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 2px var(--brand)}
.examcard .sel{background:var(--surface);border:1px solid var(--line)}
.examcard[aria-pressed="true"] .sel{background:var(--brand);color:var(--surface);border-color:var(--brand)}
.examcard .k{font-size:13px;color:var(--muted);letter-spacing:.02em}
.examcard .t{font-family:var(--display);font-size:18px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.form input,.form select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.rules{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px;color:var(--muted)}
.rules li::before{content:"◆ ";color:var(--accent)}
.btn{border:0;border-radius:12px;padding:12px 22px;background:var(--brand);color:var(--surface);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.warn{background:var(--accent);color:#1b1408}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.err{color:var(--bad);font-size:14px;min-height:1.4em}
/* exam */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:16px}
.bar .who{font-size:14px;color:var(--muted)}
.timer{font-variant-numeric:tabular-nums;font-family:var(--display);font-size:20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px 12px}
.timer.low{color:var(--bad);border-color:var(--bad)}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;flex-basis:100%}
.progress i{display:block;height:100%;background:var(--brand);transition:width .3s}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.qnum{font-family:var(--display);font-size:15px;color:var(--muted)}
.qtext{font-size:21px;line-height:1.85;margin:4px 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:10px}
.opt .pick{flex:1;min-width:0;display:flex;gap:12px;align-items:center;text-align:right;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.opt .pick .L{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--brand);color:var(--brand);font-weight:700}
.opt .pick[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt .pick[aria-checked="true"] .L{background:var(--brand);color:var(--surface)}
.opt.struck .pick span:last-child{text-decoration:line-through;opacity:.45}
.opt .x{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:15px}
.opt.struck .x{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.conf{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.conf p{margin:0 0 8px;font-size:14px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.flagbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 12px;font-size:14px}
.flagbtn[aria-pressed="true"]{border-color:var(--flag);color:var(--flag);background:var(--accent-soft)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.side h3{font-size:15px;margin-bottom:10px}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.dot{aspect-ratio:1;max-width:100%;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums;font-size:14px;position:relative}
.dot.ans{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.dot.cur{outline:3px solid var(--accent);outline-offset:1px}
.dot.flag::after{content:"";position:absolute;top:3px;left:3px;width:8px;height:8px;border-radius:50%;background:var(--flag)}
.legend{margin-top:12px;display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px;vertical-align:middle;background:var(--sw)}
/* review & result */
.list{display:grid;gap:8px;margin:14px 0}
.list button{text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px}
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:560px){.score{grid-template-columns:minmax(0,1fr)}}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);margin-inline:auto}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;font-variant-numeric:tabular-nums}
.ring b{font-family:var(--display);font-size:34px;line-height:1}
.tier{display:inline-block;font-family:var(--display);font-size:20px;padding:2px 14px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.skills{display:grid;gap:10px;margin-top:6px}
.sk{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:14.5px}
.sk .track{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.sk .track i{display:block;height:100%;background:var(--sw,var(--brand))}
.sk .v{font-variant-numeric:tabular-nums;text-align:left;color:var(--muted)}
.callout{border-radius:12px;padding:12px 14px;margin-top:14px;font-size:15px}
.callout.warn{background:var(--bad-soft);color:var(--ink)}
.callout.info{background:var(--brand-soft)}
.rev{display:grid;gap:12px;margin-top:12px}
.rv{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.rv.ok{border-inline-start:5px solid var(--ok)}
.rv.no{border-inline-start:5px solid var(--bad)}
.rv .a{font-size:15px;margin-top:4px}
.rv .a .good{color:var(--ok);font-weight:700}
.rv .a .badA{color:var(--bad);text-decoration:line-through}
.rv .e{font-size:14.5px;color:var(--muted);margin-top:4px}
.sync{font-size:13.5px;color:var(--muted);margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const BANK = {"u1_g11":{"id":"u1_g11","title":"اختبار الوحدة الأولى: من القيم الإنسانية في القرآن الكريم","short":"لغتي — الحادي عشر — الوحدة الأولى","grade":"الصف الحادي عشر (الأول الثانوي)","sections":["أول أكاديمي - و","أول أكاديمي - ز","BTEC1"],"minutes":40,"skills":["الاستماع","التحدث","القراءة","الكتابة","أبني لغتي"],"questions":[{"skill":"الاستماع","q":"خاطب رسولُ الله ﷺ أهلَ مكة يوم الفتح بعبارة «لا تثريبَ عليكم اليومَ»، مستحضرًا فيها موقفَ:","opts":["يوسفَ عليه السلام مع إخوته","موسى عليه السلام مع فرعون","إبراهيمَ عليه السلام مع قومه","نوحٍ عليه السلام مع ابنه"],"exp":"العبارة قالها يوسف عليه السلام لإخوته حين عفا عنهم، واستشهد بها النبي ﷺ في عفوه عن أهل مكة."},{"skill":"الاستماع","q":"من آداب الاستماع التي تعين على حسن الفهم:","opts":["الجلوسُ جلسةً صحيحة والإصغاءُ للمتحدث","مقاطعةُ المتحدث كلما خطر سؤال","الانشغالُ بإعداد الردّ في أثناء الحديث","تدوينُ كل كلمة يقولها المتحدث"],"exp":"الإصغاء وحسن الجلوس من آداب الاستماع التي تتيح الفهم والتفهّم."},{"skill":"التحدث","q":"أول خطوة في بناء حديثٍ عن قيمة إنسانية هي:","opts":["تعيينُ القيمة الإنسانية","الاستشهادُ بآية أو حديث","ذكرُ مواقف تتجلى فيها القيمة","عرضُ تفصيلات ومعلومات وحقائق"],"exp":"يبدأ المتحدث بتحديد القيمة، ثم يبيّن أثرها، ثم يستشهد ويذكر المواقف والتفصيلات."},{"skill":"التحدث","q":"من آداب التحدث أمام الجمهور:","opts":["التأنّي في الكلام وعدمُ الإسراع فيه","رفعُ الصوت على وتيرة واحدة","تجنّبُ النظر إلى الحاضرين","الإطالةُ لإظهار سعة المعرفة"],"exp":"التأني ووضوح اللغة والتواصل البصري من مزايا المتحدث وآدابه."},{"skill":"القراءة","q":"معنى كلمة «صَفْوان» في قوله تعالى: ﴿كمثلِ صفوانٍ عليه ترابٌ﴾:","opts":["الحجرُ الأملس","الترابُ الناعم","المطرُ الغزير","الرملُ المتحرك"],"exp":"الصفوان هو الحجر الأملس الذي لا يثبت عليه تراب إذا أصابه المطر."},{"skill":"القراءة","q":"المقصود بـ«نخيلٌ صِنوان» في سورة الرعد:","opts":["نخلاتٌ يجمعهنّ أصلٌ واحد","نخلاتٌ متباعدة في الأرض","نخيلٌ كثيرُ الثمر","نخيلٌ صغيرٌ حديثُ الغرس"],"exp":"الصنوان جمع صِنو، وهي النخلات التي تتفرع من أصل واحد."},{"skill":"القراءة","q":"قوله تعالى: ﴿ولا تجعلْ يدَك مغلولةً إلى عنقِك﴾ كنايةٌ عن:","opts":["البخل","الضعف","الغضب","التواضع"],"exp":"اليد المغلولة إلى العنق صورة لمن يمسك يده عن الإنفاق، أي البخل."},{"skill":"القراءة","q":"خرج الاستفهام في قوله تعالى: ﴿ومَن أحسنُ قولًا ممّن دعا إلى الله﴾ إلى معنى:","opts":["النفي","التعجب","التشويق","الأمر"],"exp":"المعنى: لا أحدَ أحسنُ قولًا ممن دعا إلى الله، فالاستفهام بمعنى النفي."},{"skill":"القراءة","q":"جعل الله تعالى مقياسَ التفاضل بين الناس في آية الحجرات:","opts":["التقوى","النسب","الغنى","القوة"],"exp":"﴿إنّ أكرمَكم عند الله أتقاكم﴾."},{"skill":"القراءة","q":"من الطباق الوارد في آيتي سورة الرعد (3–4):","opts":["الليل والنهار","الرواسي والأنهار","الزرع والنخيل","الثمرات والأُكُل"],"exp":"الليل والنهار لفظان متضادان، وهذا هو الطباق، وأثره توضيح المعنى بالتقابل."},{"skill":"القراءة","q":"الغرض من الصورة الفنية في قوله تعالى: ﴿إنّ المبذّرين كانوا إخوانَ الشياطين﴾:","opts":["التنفيرُ من التبذير","الحثُّ على الادّخار","بيانُ كثرة الشياطين","مدحُ الكرم والسخاء"],"exp":"جعل المبذرين إخوة للشياطين لتقبيح فعلهم وتنفير الناس منه."},{"skill":"القراءة","q":"يرشد قوله تعالى: ﴿ادفعْ بالتي هي أحسنُ﴾ إلى:","opts":["مقابلةِ الإساءة بالإحسان","مقاطعةِ المسيء","ردِّ الإساءة بمثلها","السكوتِ عن الحق"],"exp":"تدعو الآية إلى دفع السيئة بالحسنة، فيتحول العدو إلى صديق حميم."},{"skill":"القراءة","q":"جمعت آيةُ سورة النساء (58) بين قيمتين هما:","opts":["أداءُ الأمانة والحكمُ بالعدل","الصبرُ والشكر","الصدقةُ والصلاة","الحِلمُ والتواضع"],"exp":"﴿إن الله يأمركم أن تؤدّوا الأماناتِ إلى أهلها وإذا حكمتم بين الناس أن تحكموا بالعدل﴾."},{"skill":"الكتابة","q":"التقرير البحثي هو:","opts":["نصٌّ يعرض قضيةً ويحللها بأسلوب علمي ولغة مباشرة معتمدًا على مصادر موثوقة","نصٌّ أدبي يعبّر عن مشاعر الكاتب بلغة مجازية","رسالةٌ رسمية تُوجَّه إلى جهة حكومية","قصةٌ قصيرة تعرض حدثًا متخيَّلًا"],"exp":"التقرير البحثي علمي اللغة، مباشر، بعيد عن المجاز، موثّق المصادر."},{"skill":"الكتابة","q":"الجزء من التقرير البحثي الذي يوضّح هدف الدراسة ومنهجيتها ونتائجها باختصار هو:","opts":["المُلخّص","المقدمة","التوصيات","المصادر والمراجع"],"exp":"الملخص يسبق المقدمة ويعطي صورة موجزة عن الهدف والمنهج والنتائج."},{"skill":"أبني لغتي","q":"جوابُ الطلب وعلامة جزمه في قوله تعالى: ﴿ادعوني أستجبْ لكم﴾:","opts":["أستجبْ، وعلامة جزمه السكون","ادعوني، وعلامة جزمه حذف النون","أستجبْ، وعلامة جزمه حذف حرف العلة","لكم، وعلامة جزمه السكون"],"exp":"«أستجب» مضارع مجزوم لأنه جواب الطلب (ادعوني)، وهو صحيح الآخر فيجزم بالسكون."},{"skill":"أبني لغتي","q":"علامة جزم الفعل «تدخلوا» في الحديث: «أفشوا السلامَ ... تدخلوا الجنةَ بسلام»:","opts":["حذفُ النون لأنه من الأفعال الخمسة","السكون","حذفُ حرف العلة","الفتحة"],"exp":"«تدخلوا» جواب الطلب مجزوم، وهو من الأفعال الخمسة فيجزم بحذف النون."},{"skill":"أبني لغتي","q":"حُرِّك آخر الفعل «تبلغِ» بالكسر في: «تحلَّ بالأخلاق الحميدة تبلغِ المعالي»:","opts":["منعًا لالتقاء الساكنين","لأنه مجرور بالإضافة","لأنه فعل أمر","لأنه معتلّ الآخر"],"exp":"الفعل مجزوم بالسكون، وتلاه ساكن (أل)، فحُرّك بالكسر لمنع التقاء الساكنين."},{"skill":"أبني لغتي","q":"الجملة التي تتضمن فعلًا مضارعًا مجزومًا لأنه جوابُ طلب:","opts":["استثمرْ وقتَك بالقراءة تنلِ النجاحَ","إنْ تجتهدْ تنجحْ","لا تؤخّرْ عملك كي لا تندمَ","لم يتوانَ الجنودُ عن الواجب"],"exp":"«تنلِ» جواب لفعل الأمر «استثمر». أما «تنجح» فجواب شرط بأداة مذكورة، و«لم يتوانَ» مجزوم بلم."},{"skill":"أبني لغتي","q":"علامة بناء فعل الأمر «ادعُ» في: «ادعُ إلى الخير تُؤجَرْ»:","opts":["حذفُ حرف العلة","السكون","حذفُ النون","الفتح"],"exp":"فعل الأمر المعتل الآخر غير المسند إلى ضمير يُبنى على حذف حرف العلة (يدعو ← ادعُ)."}]},"istithna_g12":{"id":"istithna_g12","title":"اختبار درس الاستثناء — النحو والصرف","short":"النحو والصرف — الثاني الثانوي — الاستثناء","grade":"الصف الثاني عشر (الثاني الثانوي) — لغات","sections":["لغات ج"],"minutes":40,"skills":["المفهوم والأدوات","أنماط الاستثناء","الحكم الإعرابي","الإعراب","الضبط والتوظيف"],"questions":[{"skill":"المفهوم والأدوات","q":"أسلوب الاستثناء هو:","opts":["إخراجُ اسمٍ من حكم ما قبله بأداة استثناء","إثباتُ الحكم لاسمين معًا","حصرُ الصفة في موصوف واحد دائمًا","ربطُ جملتين بأداة  منع من ظهورها التعذّر","الفتحةُ الظاهرة","الفتحةُ المقدّرة منع من ظهورها الثقل","الياءُ لأنه مثنى"],"exp":"«سوى» اسم مقصور، فتُقدّر عليه الحركات للتعذّر."},{"skill":"الإعراب","q":"إعراب الاسم الواقع بعد «غير» و«سوى»:","opts":["مضافٌ إليه مجرور","مستثنى منصوب","بدلٌ مرفوع","مفعولٌ به منصوب"],"exp":"غير وسوى تُعربان إعراب الاسم بعد إلا، وما بعدهما مجرور بالإضافة."},{"skill":"الإعراب","q":"إعراب «زهرتين» في: «قطفتُ الأزهارَ ما عدا زهرتين»:","opts":["مفعولٌ به منصوب وعلامة نصبه الياء لأنه مثنى","مستثنى منصوب وعلامة نصبه الياء","اسمٌ مجرور بعدا وعلامة جره الياء","حالٌ منصوبة وعلامة نصبها الياء"],"exp":"بعد «ما عدا» تكون عدا فعلًا ماضيًا جامدًا، وما بعدها مفعول به."},{"skill":"الإعراب","q":"إعراب «خلا» في: «أثمرت الأشجارُ خلا شجرةٍ»:","opts":["حرفُ جرٍّ مبني على السكون","فعلٌ ماضٍ جامد مبني على الفتح المقدر","أداةُ حصر لا محل لها","حرفُ استثناء مبني على السكون"],"exp":"جُرّ ما بعدها (شجرةٍ)، فهي حرف جر. ولو نُصب ما بعدها لكانت فعلًا."},{"skill":"الإعراب","q":"إعراب «الأوفياءَ» في: «لا تصاحبْ إلا الأوفياءَ»:","opts":["مفعولٌ به منصوب","مستثنى منصوب","بدلٌ منصوب","حالٌ منصوبة"],"exp":"الاستثناء مفرّغ، و«إلا» أداة حصر ملغاة، فيعرب الاسم حسب موقعه: مفعولًا به."},{"skill":"الإعراب","q":"إعراب «عقلُه» في: «هل الإنسانُ إلا عقلُه وخُلُقُه»:","opts":["خبرُ المبتدأ مرفوع","مستثنى مرفوع","بدلٌ من الإنسان مرفوع","فاعلٌ مرفوع"],"exp":"بعد إلغاء «إلا» تصبح الجملة: الإنسانُ عقلُه وخلقُه، فعقلُه خبر."},{"skill":"الإعراب","q":"إعراب «جدولٌ» في: «ما امتلأت الجداولُ إلا جدولٌ»:","opts":["بدلٌ من «الجداول» مرفوع","مستثنى مرفوع","فاعلٌ مرفوع","خبرٌ مرفوع"],"exp":"تام غير مثبت، فجاز إتباع المستثنى للمستثنى منه على البدلية."},{"skill":"الضبط والتوظيف","q":"عند وضع «غير» مكان «إلا» في: «زرتُ المواقعَ الأثرية في الأردن إلا جرشَ» نقول:","opts":["غيرَ جرشَ","غيرِ جرشٍ","غيرُ جرشَ","غيرَ جرشٍ"],"exp":"«غير» تأخذ حكم الاسم بعد إلا (النصب)، و«جرش» مضاف إليه ممنوع من الصرف فيُجرّ بالفتحة."},{"skill":"الضبط والتوظيف","q":"الجملة الصحيحة نحويًّا:","opts":["غادر الزوارُ ما عدا زائرًا","غادر الزوارُ ما عدا زائرٍ","غادر الزوارُ إلا زائرٌ","غادر الزوارُ ما خلا زائرٌ"],"exp":"بعد «ما عدا» يجب النصب، وفي التام المثبت لا يجوز الرفع بعد إلا."},{"skill":"المفهوم والأدوات","q":"من أدوات الاستثناء الشبيهة بـ«عدا» و«خلا»، ودخولُ «ما» المصدرية عليها نادر:","opts":["حاشا","سوى","غير","ليس"],"exp":"حاشا مثل عدا وخلا، ودخول ما المصدرية عليها نادر في كلام العرب."},{"skill":"الضبط والتوظيف","q":"الصياغة الصحيحة بأسلوب الاستثناء للعبارة: «يحبّ الناسُ أوطانهم، ولا يحبّها الخائنون»:","opts":["يحبّ الناسُ أوطانهم إلا الخائنين","يحبّ الناسُ أوطانهم إلا الخائنون","يحبّ الناسُ أوطانهم غيرُ الخائنين","يحبّ الناسُ أوطانهم سوى الخائنون"],"exp":"تام مثبت: المستثنى بإلا منصوب بالياء (الخائنين). وغير تُنصب، وما بعد سوى مجرور."}]},"psy_g12":{"id":"psy_g12","points":2,"title":"اختبار علوم النفس والاجتماع","short":"علوم النفس والاجتماع — الثاني الثانوي لغات","grade":"الصف الثاني الثانوي — لغات (أ + ب)","sections":["الثاني الثانوي لغات - أ","الثاني الثانوي لغات - ب"],"minutes":30,"skills":["مفهوم علم النفس وأهميته","المنظورات الرئيسة","المنهجية والفروع","الأسس البيولوجية"],"questions":[{"skill":"مفهوم علم النفس وأهميته","q":"يعود مصطلح علم النفس (Psychology) إلى جذر يوناني قديم، تعني فيه كلمة (Psyche):","opts":["النفس أو الروح أو العقل","المعرفة أو الدراسة","السلوك الظاهر للإنسان","الضمير والوعي الأخلاقي"],"exp":"Psyche تعني النفس أو الروح أو العقل، أما logy فتعني المعرفة أو الدراسة."},{"skill":"مفهوم علم النفس وأهميته","q":"أيّ ممّا يأتي يُعدّ سلوكًا خفيًّا كامنًا داخل الإنسان؟","opts":["التذكّر والإدراك","الأكل والنوم","الكلام مع الآخرين","مشاهدة التلفاز"],"exp":"التذكّر والإدراك عمليات عقلية لا تُلاحظ مباشرة، أما البقية فسلوكات ظاهرة."},{"skill":"مفهوم علم النفس وأهميته","q":"يستند أنصار المنظور الوراثي في تفسير الشخصية غالبًا إلى أدلّة مأخوذة من:","opts":["الدراسات على التوائم المتطابقة","التجارب على الحيوانات","المقاييس النفسية","الملاحظة المنظّمة للأطفال"],"exp":"التوائم المتطابقة الذين عاشوا منفصلين خرجت قدراتهم وسماتهم متشابهة، فعدّها أنصار الوراثة دليلًا."},{"skill":"المنظورات الرئيسة","q":"يقلّد طالبٌ أصدقاءه في التدخين كي يشعر بالقبول بينهم. العالِم الذي أكّد دور التقليد في تشكيل مثل هذا السلوك هو:","opts":["ألبرت باندورا","سكنر","سيجموند فرويد","كارل روجرز"],"exp":"أكّد باندورا من السلوكيين دور التقليد في تشكيل سلوك الشخص طلبًا للاندماج والقبول."},{"skill":"المنظورات الرئيسة","q":"وفق نظرية التحليل النفسي، الشخص الذي يسيطر عليه مُركّب الأنا العليا يتّصف في الأغلب بأنه:","opts":["متزمّت وانتقادي","اندفاعي وغير متحمّل للمسؤولية","متوازن ومنضبط","طائش يسعى إلى إشباع رغباته"],"exp":"سيطرة الأنا العليا تُنتج شخصًا متزمّتًا انتقاديًّا، وسيطرة الهوى تُنتج شخصًا اندفاعيًّا، ونجاح الأنا في التوفيق يُنتج التوازن."},{"skill":"المنظورات الرئيسة","q":"ابتسم شخصٌ في وجه زميله، فعدّها الزميل سخريةً منه وردّ بعنف. يفسّر المنظور المعرفي ذلك بأنّ الزميل:","opts":["ذو تفكير سلبي استدعى خبرات سابقة من الانتقاد والسخرية","ذو تفكير إيجابي فسّر الابتسامة إطراءً","محكوم بغرائز لا شعورية من طفولته","يتصرّف وفق أنماط التعزيز في أسرته"],"exp":"المنظور المعرفي يربط ردّ الفعل بطريقة التفكير والتفسير؛ فذو التفكير السلبي يستدعي خبراته السلبية."},{"skill":"المنظورات الرئيسة","q":"يركّز المنحى الإنساني في تفسير السلوك على مفهومين رئيسين، هما:","opts":["الإرادة الحرّة ومفهوم الذات","التعزيز والعقاب","الهوى والأنا العليا","الوراثة والجهاز العصبي"],"exp":"يرى المنحى الإنساني أن الإنسان يصنع نفسه بالإرادة الحرّة، وأن مفهوم الذات يشكّل سلوكه."},{"skill":"المنظورات الرئيسة","q":"في نافذة جو-هاري، الجوانب التي يلاحظها الآخرون فيك ولا تدركها أنت عن نفسك تقع ضمن:","opts":["المنطقة العمياء","المنطقة المفتوحة","المنطقة الخفيّة","المنطقة المجهولة"],"exp":"المنطقة العمياء: غير معروفة للذات، ومعروفة للآخرين."},{"skill":"المنهجية والفروع","q":"يقيس باحث درجة القلق لدى مجموعة من الطلبة، ثم يربطها بعلاماتهم في الاختبار باستخدام معامل ارتباط بيرسون. هذا النوع من البحث يُسمّى:","opts":["الأبحاث الارتباطية","الأبحاث التجريبية","الملاحظة المنظّمة","دراسة الحالة"],"exp":"الأبحاث الارتباطية تحدّد درجة العلاقة ونوعها بين متغيّرين، مثل القلق والأداء."},{"skill":"المنهجية والفروع","q":"الميدان الذي يهتمّ // ربط مسار: عند استضافة الملف خارج claude.ai ضعي رابط Supabase والمفتاح العام (anon) هنا
const CFG = window.MASAR_CONFIG || {};
const LET = ["أ","ب","ج","د"];
const CONF = [{v:3,t:"متأكدة تمامًا"},{v:2,t:"متأكدة نوعًا ما"},{v:1,t:"أخمّن"}];
const KEY = "masar-exam-v1";
const $ = s => document.querySelector(s);
const app = $("#app");
let S = load() || { stage:"start", examId:null, name:"", section:"" };
let tick = null;

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function esc(t){ return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function tierOf(p){ return p>=90?"ممتاز":p>=80?"جيد جدًا":p>=70?"جيد":p>=60?"متوسط":p>=50?"مقبول":"دون حدّ النجاح"; }
const exam = () => BANK[S.examId];

function render(){
  clearInterval(tick);
  if(S.stage==="start") return renderStart();
  if(S.stage==="exam") return renderExam();
  if(S.stage==="review") return renderReview();
  if(S.stage==="result") return renderResult();
}
function mast(sub){
  return `<div class="mast"><div class="seal">م</div><div><h1 style="font-size:22px">امتحانات مسار</h1><small>${esc(sub)}</small></div></div>`;
}

/* ---------- البداية ---------- */
function renderStart(){
  const ids = Object.keys(BANK);
  app.innerHTML = mast("مدرسة الأميرة راية بنت الحسين الثانوية للبنات") + `
  <section class="panel">
    <h2 style="font-size:20px">اختاري الامتحان</h2>
    <div class="examcards" role="radiogroup">${ids.map(id=>{const e=BANK[id];return `
      <label class="examcard" data-card="${id}" aria-pressed="${S.examId===id}">
        <input type="radio" name="exsel" value="${id}" ${S.examId===id?"checked":""} style="position:absolute;opacity:0;pointer-events:none">
        <span class="k">${esc(e.grade)}</span><span class="t">${esc(e.title)}</span>
        <span class="meta"><span class="chip">${e.questions.length} سؤالًا</span><span class="chip">العلامة من ${e.questions.length*(e.points||1)}</span><span class="chip">${e.minutes} دقيقة</span><span class="chip sel">${S.examId===id?"✓ مختار":"اضغطي للاختيار"}</span></span>
      </label>`}).join("")}</div>
    <div class="form">
      <label for="nm">الاسم الثلاثي<input id="nm" autocomplete="name" value="${esc(S.name)}" placeholder="مثال: سارة محمد أحمد"></label>
      <label for="sec">الشعبة<select id="sec"></select></label>
    </div>
    <ul class="rules">
      <li>يظهر كل سؤال في صفحة مستقلة، ويمكنك التنقل للأمام والخلف وتغيير إجابتك قبل التسليم.</li>
      <li>علّمي أي سؤال «للمراجعة» لتعودي إليه، واشطبي الخيارات التي تستبعدينها.</li>
      <li>حدّدي بعد كل إجابة مدى ثقتك بها؛ هذا لا يؤثر في علامتك، لكنه يساعد معلمتك على مساعدتك.</li>
      <li>تُحفظ إجاباتك تلقائيًا، وتظهر علامتك فور التسليم.</li>
    </ul>
    <p class="err" id="err"></p>
    <div class="row" style="justify-content:space-between"><button class="btn" id="go" type="button">ابدئي الامتحان</button>
    <button class="btn ghost" id="tlog" type="button" style="font-size:14px;padding:8px 14px">للمعلمة: نتائج هذا الجهاز</button></div>
  </section>`;
  const fillSections=()=>{
    const sel=$("#sec");
    sel.innerHTML = ids.map(id=>`<optgroup label="${esc(BANK[id].short)}">${BANK[id].sections.map(s=>`<option value="${esc(s)}" data-ex="${id}" ${S.section===s?"selected":""}>${esc(s)}</option>`).join("")}</optgroup>`).join("");
    if(S.examId && !BANK[S.examId].sections.includes(sel.value)){ S.section=BANK[S.examId].sections[0]; sel.value=S.section; }
  };
  const choose=id=>{
    S.examId=id; if(!BANK[id].sections.includes(S.section)) S.section=BANK[id].sections[0];
    app.querySelectorAll("[data-card]").forEach(c=>{const on=c.dataset.card===id; c.setAttribute("aria-pressed",on); c.querySelector(".sel").textContent=on?"✓ مختار":"اضغطي للاختيار"; c.querySelector("input").checked=on;});
    $("#sec").value=S.section; $("#err").textContent=""; save();
  };
  fillSections();
  app.querySelectorAll("[data-card]").forEach(c=>{
    c.addEventListener("click",ev=>{ ev.preventDefault(); choose(c.dataset.card); });
  });
  $("#sec").addEventListener("change",e=>{ const o=e.target.selectedOptions[0]; S.section=o.value; if(o.dataset.ex&&o.dataset.ex!==S.examId) choose(o.dataset.ex); });
  $("#tlog").onclick=renderLog;
  $("#go").onclick=()=>{
    const name=$("#nm").value.trim(), sec=$("#sec").value;
    if(!S.examId) return $("#err").textContent="اضغطي على بطاقة الامتحان أعلاه لاختياره.";
    if(name.split(/\s+/).length<2) return $("#err").textContent="اكتبي اسمك الثنائي على الأقل حتى تُرصد علامتك باسمك.";
    if(!BANK[S.examId].sections.includes(sec)) return $("#err").textContent="الشعبة المختارة لا تتبع هذا الامتحان.";
    const e=exam();
    S={stage:"exam", examId:S.examId, name, section:sec, cur:0, leaves:0,
       order: shuffle(e.questions.map((_,i)=>i)).map(i=>({i, o:shuffle([0,1,2,3])})),
       ans:{}, conf:{}, flag:{}, strike:{}, startedAt:Date.now(), endsAt:Date.now()+e.minutes*60000};
    save(); render();
  };
}

/* ---------- سجل المعلمة ---------- */
function renderLog(){
  let L=[]; try{ L=JSON.parse(localStorage.getItem(KEY+"-log")||"[]"); }catch(e){}
  const txt=L.map(r=>[new Date(r.t).toLocaleString("ar-JO"),r.ex,r.name,r.sec,`${r.score}/${r.total}`,r.skills].join("\t")).join("\n");
  app.innerHTML = mast("سجل النتائج على هذا الجهاز") + `<section class="panel">
    <p>عدد الطالبات اللواتي امتحنّ على هذا الجهاز: <b>${L.length}</b> — نتائج لم تُرسل بعد: <b id="pend">${getQ().length}</b> ${getQ().length?'<button class="btn ghost" id="rs" style="padding:4px 12px;font-size:13px">أرسليها الآن</button>':''}</p>
    <p style="font-size:13.5px;color:var(--muted)">الإرسال: ${hasSB()?"✓ مسار (Supabase)":"✗ مسار غير مربوط"} — ${hasTG()?"✓ تيليجرام":"✗ تيليجرام غير مربوط"}${CFG.stationName?` — الجهاز: ${esc(CFG.stationName)}`:""}</p>
    <div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:14px;min-width:560px">
      <tr style="background:var(--brand-soft)"><th style="padding:6px">الوقت</th><th>الامتحان</th><th>الاسم</th><th>الشعبة</th><th>العلامة</th><th>مغادرة الصفحة</th></tr>
      ${L.map(r=>`<tr style="border-top:1px solid var(--line)"><td style="padding:6px">${new Date(r.t).toLocaleString("ar-JO")}</td><td>${esc(r.ex)}</td><td>${esc(r.name)}</td><td>${esc(r.sec)}</td><td><b>${r.score}/${r.total}</b></td><td>${r.leaves}${r.auto?" (سُلّم تلقائيًا)":""}</td></tr>`).join("")||'<tr><td colspan="6" style="padding:10px">لا نتائج بعد.</td></tr>'}
    </table></div>
    <p style="font-size:14px;color:var(--muted)">«نسخ النتائج» ينسخها بصيغة تُلصق مباشرة في Excel أو ترسَل إلى بوت مسار.</p>
    <textarea id="tx" readonly style="width:100%;height:90px;font-size:12px;direction:rtl;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px">${esc(txt)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn" id="cp">نسخ النتائج</button><button class="btn ghost" id="bk">رجوع</button><span id="cpm" class="sync"></span></div>
  </section>`;
  $("#bk").onclick=()=>render();
  if($("#rs")) $("#rs").onclick=async()=>{ $("#rs").textContent="جارٍ الإرسال…"; await flush(); renderLog(); };
  $("#cp").onclick=async()=>{ try{ await navigator.clipboard.writeText(txt); $("#cpm").textContent="✓ نُسخت"; }catch(e){ $("#tx").select(); document.execCommand&&document.execCommand("copy"); $("#cpm").textContent="حُدّد النص؛ اضغطي Ctrl+C"; } };
}

/* ---------- الامتحان ---------- */
function renderExam(){
  const e=exam(), n=S.order.length, k=S.cur, it=S.order[k], q=e.questions[it.i];
  const answered=Object.keys(S.ans).length;
  app.innerHTML = `
  <div class="bar">
    <div><h2 style="font-size:17px">${esc(e.short)}</h2><div class="who">${esc(S.name)} — ${esc(S.section)}</div></div>
    <div class="row"><span class="who">أُجيب ${answered} من ${n}</span><span class="timer" id="tm" role="timer"></span></div>
    <div class="progress"><i style="width:${answered/n*100}%"></i></div>
  </div>
  <div class="grid">
    <section class="panel">
      <div class="qhead"><span class="qnum">السؤال ${k+1} من ${n}</span>
        <span class="row"><span class="chip">${esc(q.skill)}</span>
        <button class="flagbtn" id="flag" aria-pressed="${!!S.flag[k]}">⚑ ${S.flag[k]?"معلَّم للمراجعة":"علّميه للمراجعة"}</button></span></div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts" role="radiogroup" aria-label="الخيارات">${it.o.map((oi,pos)=>{
        const st=(S.strike[k]||[]).includes(pos);
        return `<div class="opt ${st?"struck":""}">
          <button class="pick" role="radio" aria-checked="${S.ans[k]===pos}" data-pos="${pos}"><span class="L">${LET[pos]}</span><span>${esc(q.opts[oi])}</span></button>
          <button class="x" data-strike="${pos}" title="${st?"إلغاء الشطب":"شطب هذا الخيار"}" aria-label="شطب الخيار ${LET[pos]}">✕</button></div>`}).join("")}</div>
      <div class="conf"><p>ما مدى ثقتك بإجابتك؟</p><div class="seg">${CONF.map(c=>`<button data-conf="${c.v}" aria-pressed="${S.conf[k]===c.v}" ${S.ans[k]===undefined?"disabled":""}>${c.t}</button>`).join("")}</div></div>
      <div class="nav">
        <button class="btn ghost" id="prev" ${k===0?"disabled":""}>→ السابق</button>
        ${k<n-1?`<button class="btn" id="next">التالي ←</button>`:`<button class="btn warn" id="toReview">مراجعة قبل التسليم</button>`}
      </div>
    </section>
    <aside class="panel side"><h3>خريطة الأسئلة</h3>
      <div class="dots">${S.order.map((_,j)=>`<button class="dot ${S.ans[j]!==undefined?"ans":""} ${S.flag[j]?"flag":""} ${j===k?"cur":""}" data-go="${j}" aria-label="السؤال ${j+1}">${j+1}</button>`).join("")}</div>
      <div class="legend"><span style="--sw:var(--brand)">مُجاب</span><span style="--sw:var(--flag)">معلَّم للمراجعة</span><span style="--sw:var(--line)">لم يُجب بعد</span></div>
      <button class="btn ghost" id="toReview2" style="margin-top:14px;width:100%">مراجعة وتسليم</button>
    </aside>
  </div>`;
  app.querySelectorAll(".pick").forEach(b=>b.onclick=()=>{ const p=+b.dataset.pos; S.ans[k]=p; if(S.strike[k]) S.strike[k]=S.strike[k].filter(x=>x!==p); save(); renderExam(); });
  app.querySelectorAll("[data-strike]").forEach(b=>b.onclick=()=>{ const p=+b.dataset.strike, a=S.strike[k]||[]; S.strike[k]=a.includes(p)?a.filter(x=>x!==p):[...a,p]; if(S.ans[k]===p) delete S.ans[k]; save(); renderExam(); });
  app.querySelectorAll("[data-conf]").forEach(b=>b.onclick=()=>{ S.conf[k]=+b.dataset.conf; save(); renderExam(); });
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ S.cur=+b.dataset.go; save(); renderExam(); });
  $("#flag").onclick=()=>{ S.flag[k]=!S.flag[k]; save(); renderExam(); };
  $("#prev").onclick=()=>{ S.cur--; save(); renderExam(); };
  if($("#next")) $("#next").onclick=()=>{ S.cur++; save(); renderExam(); };
  [$("#toReview"),$("#toReview2")].forEach(b=>b&&(b.onclick=()=>{ S.stage="review"; save(); render(); }));
  startTimer();
}
function startTimer(){
  const t=$("#tm"); clearInterval(tick);
  const f=()=>{ const ms=S.endsAt-Date.now(); if(ms<=0){ clearInterval(tick); submit(true); return; }
    const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); if(t){ t.textContent=`${m}:${String(s).padStart(2,"0")}`; t.classList.toggle("low",ms<5*60000);} };
  f(); tick=setInterval(f,1000);
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden && S.stage==="exam"){ S.leaves=(S.leaves||0)+1; save(); } });

/* ---------- المراجعة ---------- */
function renderReview(){
  const n=S.order.length, un=[], fl=[];
  for(let j=0;j<n;j++){ if(S.ans[j]===undefined) un.push(j); if(S.flag[j]) fl.push(j); }
  app.innerHTML = mast(exam().short) + `<section class="panel">
    <div class="row" style="justify-content:space-between"><h2 style="font-size:20px">قبل التسليم</h2><span class="timer" id="tm"></span></div>
    <p>أجبتِ عن <b>${n-un.length}</b> من <b>${n}</b> سؤالًا.</p>
    ${un.length?`<div class="callout warn">أسئلة بلا إجابة (السؤال المتروك علامته صفر):<div class="list">${un.map(j=>`<button data-go="${j}">السؤال ${j+1}</button>`).join("")}</div></div>`:""}
    ${fl.length?`<div class="callout info">أسئلة علّمتِها للمراجعة:<div class="list">${fl.map(j=>`<button data-go="${j}">السؤال ${j+1}</button>`).join("")}</div></div>`:""}
    <p class="err">بعد التسليم لا يمكن تعديل الإجابات.</p>
    <div class="row"><button class="btn ghost" id="back">العودة إلى الأسئلة</button><button class="btn warn" id="sub">تسليم الامتحان</button></div>
  </section>`;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ S.cur=+b.dataset.go; S.stage="exam"; save(); render(); });
  $("#back").onclick=()=>{ S.stage="exam"; save(); render(); };
  $("#sub").onclick=()=>submit(false);
  startTimer();
}

/* ---------- التصحيح والنتيجة ---------- */
function grade(){
  const e=exam(), per={}, items=[];
  e.skills.forEach(s=>per[s]={c:0,t:0});
  S.order.forEach((it,j)=>{
    const q=e.questions[it.i], chosenPos=S.ans[j], correctPos=it.o.indexOf(0), ok=chosenPos===correctPos;
    per[q.skill].t++; if(ok) per[q.skill].c++;
    items.push({j, q, ok, chosen: chosenPos===undefined?null:q.opts[it.o[chosenPos]], correct:q.opts[0], conf:S.conf[j]||null});
  });
  const P=exam().points||1, score=items.filter(x=>x.ok).length*P;
  return {score, total:items.length*P, per, items};
}
function logResult(g){
  try{
    const L=JSON.parse(localStorage.getItem(KEY+"-log")||"[]");
    L.push({t:S.submittedAt,ex:exam().short,name:S.name,sec:S.section,score:g.score,total:g.total,
      skills:Object.entries(g.per).map(([k,v])=>`${k} ${v.c}/${v.t}`).join("، "),leaves:S.leaves||0,auto:!!S.auto});
    localStorage.setItem(KEY+"-log",JSON.stringify(L));
  }catch(e){}
}
function submit(auto){
  const g=grade();
  S.stage="result"; S.auto=auto; S.submittedAt=Date.now(); S.result={score:g.score,total:g.total}; S.sync="pending"; save(); logResult(g);
  render(); sendToMasar(g);
}
/* ---------- الإرسال إلى مسار وتيليجرام (مع طابور عند انقطاع الإنترنت) ---------- */
const QK = KEY+"-queue";
const getQ=()=>{ try{ return JSON.parse(localStorage.getItem(QK)||"[]"); }catch(e){ return []; } };
const setQ=q=>{ try{ localStorage.setItem(QK,JSON.stringify(q)); }catch(e){} };
const hasSB=()=>!!(CFG.supabaseUrl&&CFG.supabaseKey), hasTG=()=>!!(CFG.telegramToken&&CFG.telegramChatId);
async function pushOne(it){
  if(hasSB() && !it.sb){
    const h={"apikey":CFG.supabaseKey,"Content-Type":"application/json","Prefer":"return=minimal"};
    if(!CFG.supabaseKey.startsWith("sb_")) h.Authorization="Bearer "+CFG.supabaseKey;
    const r=await fetch(CFG.supabaseUrl.replace(/\/$/,"")+"/rest/v1/exam_results",{method:"POST",headers:h,body:JSON.stringify(it.row)});
    if(r.ok) it.sb=true;
  }
  if(hasTG() && !it.tg){
    const r=await fetch("https://api.telegram.org/bot"+CFG.telegramToken+"/sendMessage",{method:"POST",body:new URLSearchParams({chat_id:String(CFG.telegramChatId),text:it.text})});
    if(r.ok) it.tg=true;
  }
  return (!hasSB()||it.sb) && (!hasTG()||it.tg);
}
let flushing=false;
async function flush(){
  if(flushing||(!hasSB()&&!hasTG())) return;
  flushing=true;
  const q=getQ(), rest=[];
  for(const it of q){ let done=false; try{ done=await pushOne(it); }catch(e){} if(!done) rest.push(it); }
  setQ(rest); flushing=false;
  if(S.stage==="result" && S.qid){ S.sync = rest.some(x=>x.id===S.qid) ? "queued" : "sent"; save(); showSync(); }
  const pc=$("#pend"); if(pc) pc.textContent=rest.length;
}
window.addEventListener("online", flush);
setInterval(flush, 60000);
function tgText(g,row){
  const e=exam(), p=row.percent;
  return `📝 ${e.short}\n👤 ${S.name} — ${S.section}\n✅ العلامة: ${g.score}/${g.total} (${p}٪) — ${tierOf(p)}\n📊 ${Object.entries(g.per).map(([k,v])=>`${k} ${v.c}/${v.t}`).join(" | ")}`+
    (row.confident_wrong?`\n⚠️ أخطاء واثقة: ${row.confident_wrong}`:"")+(row.tab_leaves?`\n🚪 غادرت الصفحة ${row.tab_leaves} مرة`:"")+(row.auto_submitted?`\n⏱️ سُلّم تلقائيًا لانتهاء الوقت`:"")+
    `\n🕒 ${Math.round(row.duration_sec/60)} دقيقة${CFG.stationName?` — ${CFG.stationName}`:""}`;
}
async function sendToMasar(g){
  const e=exam();
  const row={ exam_id:e.id, exam_title:e.title, student_name:S.name, class_name:S.section, score:g.score, total:g.total,
    percent:Math.round(g.score/g.total*100), skills:Object.fromEntries(Object.entries(g.per).map(([k,v])=>[k,`${v.c}/${v.t}`])),
    confident_wrong:g.items.filter(x=>!x.ok&&x.conf===3).length, tab_leaves:S.leaves||0, auto_submitted:!!S.auto,
    duration_sec:Math.round((S.submittedAt-S.startedAt)/1000), mode:"electronic",
    answers:g.items.map(x=>({orig:S.order[x.j].i, ok:x.ok, conf:x.conf})) };
  if(!hasSB()&&!hasTG()){ S.sync="local"; save(); return showSync(); }
  S.qid = Date.now()+"-"+Math.random().toString(36).slice(2,7);
  const q=getQ(); q.push({id:S.qid,row,text:tgText(g,row),sb:false,tg:false}); setQ(q);
  S.sync="pending"; save(); showSync();
  await flush();
}
function showSync(){
  const el=$("#sync"); if(!el) return;
  el.textContent={pending:"جارٍ إرسال العلامة إلى معلمتك…", sent:"✓ وصلت علامتك إلى معلمتك.", queued:"✓ حُفظت العلامة، وستُرسل تلقائيًا عند عودة الإنترنت.", failed:"تعذّر الإرسال الآن، وستُعاد المحاولة تلقائيًا.", local:"العلامة محفوظة على هذا الجهاز. أظهري هذه الشاشة لمعلمتك لترصدها."}[S.sync]||"";
}
function renderResult(){
  const e=exam(), g=grade(), p=Math.round(g.score/g.total*100);
  const confWrong=g.items.filter(x=>!x.ok&&x.conf===3);
  const weak=Object.entries(g.per).filter(([,v])=>v.t&&v.c/v.t<0.5).map(([k])=>k);
  app.innerHTML = mast(e.short) + `<section class="panel">
    <div class="score">
      <div class="ring" style="--p:${p}"><div><div><b>${g.score}</b><br><span style="color:var(--muted)">من ${g.total}</span></div></div></div>
      <div><h2 style="font-size:21px">${esc(S.name)}</h2><p style="margin:2px 0 8px;color:var(--muted)">${esc(S.section)} — ${new Date(S.submittedAt).toLocaleString("ar-JO")}</p>
        <span class="tier">${tierOf(p)} — ${p}٪</span>
        ${S.auto?`<p class="err">انتهى الوقت فسُلّم الامتحان تلقائيًا.</p>`:""}
        <p class="sync" id="sync"></p></div>
    </div>
    <h3 style="font-size:17px;margin-top:22px">أداؤك في المهارات</h3>
    <div class="skills">${Object.entries(g.per).map(([k,v])=>{const r=v.t?v.c/v.t:0;return `<div class="sk"><span>${esc(k)}</span><span class="track"><i style="width:${r*100}%;--sw:${r>=.75?"var(--ok)":r>=.5?"var(--accent)":"var(--bad)"}"></i></span><span class="v">${v.c}/${v.t}</span></div>`}).join("")}</div>
    ${weak.length?`<div class="callout warn">مهارات تحتاج إلى مراجعة: <b>${weak.map(esc).join("، ")}</b>.</div>`:`<div class="callout info">أداء متوازن في جميع المهارات. أحسنتِ.</div>`}
    ${confWrong.length?`<div class="callout warn"><b>أخطاء واثقة (${confWrong.length}):</b> أجبتِ عنها وأنتِ متأكدة تمامًا، وكانت خاطئة. راجعي هذه المفاهيم أولًا: ${confWrong.map(x=>"السؤال "+(x.j+1)).join("، ")}.</div>`:""}
    <h3 style="font-size:17px;margin-top:22px">مراجعة الإجابات</h3>
    <div class="rev">${g.items.map(x=>`<div class="rv ${x.ok?"ok":"no"}">
      <div><b>${x.j+1}.</b> ${esc(x.q.q)}</div>
      <div class="a">${x.ok?`<span class="good">✓ ${esc(x.correct)}</span>`:`${x.chosen?`<span class="badA">${esc(x.chosen)}</span> ← `:"لم تُجيبي ← "}<span class="good">${esc(x.correct)}</span>`}</div>
      ${x.ok?"":`<div class="e">${esc(x.q.exp)}</div>`}</div>`).join("")}</div>
    <div class="row" style="margin-top:20px"><button class="btn ghost" id="again">طالبة جديدة على هذا الجهاز</button></div>
  </section>`;
  showSync();
  $("#again").onclick=()=>{ $("#again").outerHTML=`<span class="row"><span>ستُمسح نتيجة ${esc(S.name)} من هذا الجهاز. متأكدة؟</span><button class="btn warn" id="yes">نعم، ابدئي من جديد</button></span>`; $("#yes").onclick=()=>{ S={stage:"start",examId:S.examId,name:"",section:S.section}; save(); render(); }; };
}
render(); setTimeout(flush, 1500);
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
